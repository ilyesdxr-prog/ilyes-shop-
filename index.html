<label>العنوان بالتفصيل:</label>
                <input type="text" id="address" required placeholder="الحي، الشارع، أو نقطة الدلالة">
            </div>
            <div class="form-group">
                <label>الكمية:</label>
                <select id="quantity">
                    <option value="1">قطعة واحدة</option>
                    <option value="2">قطعتان (- تخفيضพิเศษ)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">تأكيد الطلب الآن</button>
        </form>

        <div id="successAlert" class="alert alert-success">تم تسجيل طلبك بنجاح! سنتصل بك قريباً لتأكيد الشحن.</div>
    </div>

    <footer>
        جميع الحقوق محفوطة © 2026 - Ilyes Shop
    </footer>

    <script>
        // ضع هنا رابط Web App الذي نسخته من Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm3UJJ5_SO9cC5QXuE8n9FdhOuWQ5EWf8lI5IfZUbJRmTce4hJpusHTz9rTnlJWMkp/exec";

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                wilaya: document.getElementById('wilaya').value,
                commune: document.getElementById('commune').value,
                address: document.getElementById('address').value,
                product: "ساعة ذكية أصلية",
                quantity: document.getElementById('quantity').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            }).then(() => {
                document.getElementById('orderForm').reset();
                document.getElementById('successAlert').style.display = 'block';
                btn.innerText = "تأكيد الطلب الآن";
                btn.disabled = false;
            }).catch(error => {
                alert("حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.");
                btn.innerText = "تأكيد الطلب الآن";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
