<option value="سطيف">19 - سطيف</option>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">العنوان بالتفصيل (الحي، الشارع)</label>

            <div id="successMessage" class="hidden mt-4 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-center font-semibold">

    <!-- الفوتر -->
    <footer class="text-center py-6 text-xs text-gray-500">
        Ilyes Shop - جميع الحقوق محفوظة © 2026
    </footer>

    <!-- سكربت الربط مع Google Sheets -->
    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbwm3UJJ5_SO9cC5QXuE8n9FdhOuWQ5EWf8lI5IfZUbJRmTce4hJpusHTz9rTnlJWMkp/exec";
        const form = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري إرسال طلبك...';

            let requestBody = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                state: document.getElementById('state').value,
                address: document.getElementById('address').value
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(requestBody) })
                .then(response => {
                    form.reset();
                    submitBtn.classList.add('hidden');
                    successMessage.classList.remove('hidden');
                })
                .catch(error => {
                    alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'تأكيد الطلب الآن 🚀';
                });
        });
    </script>
</body>
</html>
